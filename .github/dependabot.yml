version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven:
        patterns:
          - "*"
    ignore:
      # JUnit 6 requires Java 17, but tests still run on JDK 8.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
