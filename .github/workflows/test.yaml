name: test
on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test on Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            java_architecture: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            java_architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 8
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 8
        distribution: 'zulu'
        architecture: ${{ matrix.java_architecture }}
        cache: maven
    - name: Update Package Information
      run: sudo apt-get update
    - name: Install Dependencies
      run: sudo apt-get install -y git xvfb x11-utils mesa*
    - name: Build with Maven
      run: |
        export XVFB_WHD="1920x1080x24"
        export DISPLAY=":99"
        export GALLIUM_DRIVER="llvmpipe"
        export LIBGL_ALWAYS_SOFTWARE="1"
        # Start Xvfb
        echo "Starting Xvfb"
        Xvfb :99 -ac -screen 0 "$XVFB_WHD" -nolisten tcp +extension GLX +render -noreset &
        Xvfb_pid="$!"
        echo "Waiting for Xvfb (PID: $Xvfb_pid) to be ready..."
        if ! timeout 10s bash -c 'until xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; do sleep 0.1; done'; then
          echo "::error::Xvfb did not become ready within 10 seconds"
          exit 1
        fi
        echo "Xvfb is running."

        ./mvnw -B test
    - name: Upload Images
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: images-linux-${{ matrix.arch }}
        path: 'target/*.png'
  test-windows:
    name: Test on Windows (${{ matrix.arch }}, ${{ matrix.test_scope }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            java_version: '8'
            java_architecture: x64
            mesa: true
            test_scope: full suite
            upload_images: true
          # Zulu 8 and the Mesa software driver are not available for Windows ARM64.
          # Still exercise ARM64 compilation, native dependency resolution, and unit behavior.
          - arch: arm64
            runner: windows-11-arm
            java_version: '17'
            java_architecture: aarch64
            mesa: false
            test_scope: unit smoke
            upload_images: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'
          architecture: ${{ matrix.java_architecture }}
          cache: maven
      - name: Register Mesa as the OpenGL driver
        if: matrix.mesa
        shell: pwsh
        env:
          MESA_VERSION: '26.1.4'
          MESA_SHA256: '3804c66059c17b7ce12ca8596782585547e20c2185938f89663ec7b807ef0a84'
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $extracted = Join-Path $env:RUNNER_TEMP 'mesa'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 10 --output "$archive" "$url"
          $hash = (Get-FileHash "$archive" -Algorithm SHA256).Hash
          if ($hash -ne $env:MESA_SHA256.ToUpper()) {
            throw "Mesa checksum mismatch: expected $env:MESA_SHA256, got $hash"
          }
          7z x "$archive" "-o$extracted" 'x64\libgallium_wgl.dll' 'x64\dxil.dll'
          # This mirrors Mesa's own systemwidedeploy.cmd: rather than overwriting the
          # TrustedInstaller-owned opengl32.dll, install the Gallium driver as mesadrv.dll and let
          # the system opengl32.dll load it as the MSOGL installable client driver.
          $system32 = Join-Path $env:SystemRoot 'System32'
          Copy-Item (Join-Path $extracted 'x64\libgallium_wgl.dll') (Join-Path $system32 'mesadrv.dll') -Force
          Copy-Item (Join-Path $extracted 'x64\dxil.dll') $system32 -Force
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name 'DLL' -Value 'mesadrv.dll' -Type String
          Set-ItemProperty -Path $key -Name 'DriverVersion' -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name 'Flags' -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name 'Version' -Value 2 -Type DWord
          Get-Item (Join-Path $system32 'mesadrv.dll') | Format-Table Name, Length
          Get-ItemProperty -Path $key | Format-List DLL, DriverVersion, Flags, Version
      - name: Build with Maven (full suite)
        if: matrix.test_scope == 'full suite'
        run: ./mvnw -B test
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Build with Maven (unit smoke)
        if: matrix.test_scope == 'unit smoke'
        run: ./mvnw -B -Dtest=AWTGLCanvasLifecycleTest test
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload Images
        if: always() && matrix.upload_images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-windows-${{ matrix.arch }}
          path: 'target/*.png'
  test-macos:
    name: Test on macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            java_architecture: x64
          - arch: arm64
            runner: macos-15
            java_architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 8
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 8
          distribution: 'zulu'
          architecture: ${{ matrix.java_architecture }}
          cache: maven
      - name: Build with Maven
        # Hosted runners cannot retain macOS 15's private-window-picker authorization between jobs.
        run: ./mvnw -B -Dlwjgl3.awt.robotScreenshots=off test
      - name: Upload Images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-macos-${{ matrix.arch }}
          path: 'target/*.png'
      - name: Collect native crash logs
        if: failure()
        run: |
          mkdir -p crash-logs
          # JVM fatal error logs
          cp -v hs_err_pid*.log crash-logs/ 2>/dev/null || true
          cp -v target/hs_err_pid*.log crash-logs/ 2>/dev/null || true
          # JVM crash replay files
          cp -v replay_pid*.log crash-logs/ 2>/dev/null || true
          cp -v target/replay_pid*.log crash-logs/ 2>/dev/null || true
          # macOS crash reporter writes per-process .ips files here
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            cp -rv "$HOME/Library/Logs/DiagnosticReports" crash-logs/user-DiagnosticReports 2>/dev/null || true
          fi
          if [ -d /Library/Logs/DiagnosticReports ]; then
            sudo cp -rv /Library/Logs/DiagnosticReports crash-logs/system-DiagnosticReports 2>/dev/null || true
          fi
          # Surefire fork dumps (.dump, .dumpstream, -jvmRun*.dump)
          if [ -d target/surefire-reports ]; then
            cp -rv target/surefire-reports crash-logs/surefire-reports 2>/dev/null || true
          fi
          echo "collected crash artifacts"
          ls -laR crash-logs || true
      - name: Upload crash logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-logs-macos-${{ matrix.arch }}
          path: 'crash-logs/'
          if-no-files-found: warn
  smoke-modern-jdks:
    name: Smoke on ${{ matrix.os_name }} (JDK ${{ matrix.java_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            artifact_os: linux
            runner: ubuntu-24.04
            java_version: '17'
          - os_name: Linux
            artifact_os: linux
            runner: ubuntu-24.04
            java_version: '21'
          - os_name: Windows
            artifact_os: windows
            runner: windows-2025
            java_version: '17'
          - os_name: Windows
            artifact_os: windows
            runner: windows-2025
            java_version: '21'
          - os_name: macOS
            artifact_os: macos
            runner: macos-15-intel
            java_version: '17'
          - os_name: macOS
            artifact_os: macos
            runner: macos-15-intel
            java_version: '21'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'
          architecture: x64
          cache: maven
      - name: Update Package Information
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y git xvfb x11-utils mesa*
      - name: Register Mesa as the OpenGL driver
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MESA_VERSION: '26.1.4'
          MESA_SHA256: '3804c66059c17b7ce12ca8596782585547e20c2185938f89663ec7b807ef0a84'
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $extracted = Join-Path $env:RUNNER_TEMP 'mesa'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 10 --output "$archive" "$url"
          $hash = (Get-FileHash "$archive" -Algorithm SHA256).Hash
          if ($hash -ne $env:MESA_SHA256.ToUpper()) {
            throw "Mesa checksum mismatch: expected $env:MESA_SHA256, got $hash"
          }
          7z x "$archive" "-o$extracted" 'x64\libgallium_wgl.dll' 'x64\dxil.dll'
          $system32 = Join-Path $env:SystemRoot 'System32'
          Copy-Item (Join-Path $extracted 'x64\libgallium_wgl.dll') (Join-Path $system32 'mesadrv.dll') -Force
          Copy-Item (Join-Path $extracted 'x64\dxil.dll') $system32 -Force
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name 'DLL' -Value 'mesadrv.dll' -Type String
          Set-ItemProperty -Path $key -Name 'DriverVersion' -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name 'Flags' -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name 'Version' -Value 2 -Type DWord
          Get-Item (Join-Path $system32 'mesadrv.dll') | Format-Table Name, Length
          Get-ItemProperty -Path $key | Format-List DLL, DriverVersion, Flags, Version
      - name: Run repeated lifecycle smoke (Linux)
        if: runner.os == 'Linux'
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XVFB_WHD="1920x1080x24"
          export DISPLAY=":99"
          Xvfb :99 -ac -screen 0 "$XVFB_WHD" -nolisten tcp +extension GLX +render -noreset &
          Xvfb_pid="$!"
          trap 'kill "$Xvfb_pid" 2>/dev/null || true' EXIT
          if ! timeout 10s bash -c 'until xdpyinfo -display "$DISPLAY" > /dev/null 2>&1; do sleep 0.1; done'; then
            echo "::error::Xvfb did not become ready within 10 seconds"
            exit 1
          fi
          ./mvnw -B -Dtest=JAWTDrawingSurfaceThreadLifetimeTest test
      - name: Run repeated lifecycle smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: ./mvnw -B -Dtest=JAWTDrawingSurfaceThreadLifetimeTest test
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-smoke-${{ matrix.artifact_os }}-jdk-${{ matrix.java_version }}
          path: |
            hs_err_pid*.log
            target/hs_err_pid*.log
            target/surefire-reports/
          if-no-files-found: warn
