name: GitHub Actions Security Analysis with zizmor
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # to upload zizmor's SARIF results to code scanning
      contents: read
      actions: read # for the SARIF upload to resolve the triggering workflow run
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # audit every workflow, action and dependabot config in the repo,
          # with the strictest persona so informational findings fail too
          collect: all
          persona: auditor
